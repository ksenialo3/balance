<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fa;
      color: #392d33;
    }

    .app {
      max-width: 430px;
      margin: 0 auto;
      padding: 24px 18px;
    }

    .back {
      display: inline-block;
      margin-bottom: 22px;
      color: #c65f87;
      text-decoration: none;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .subtitle {
      color: #9b7c89;
      line-height: 1.5;
      margin-bottom: 26px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 22px;
      margin-bottom: 14px;
      box-shadow: 0 6px 20px rgba(120, 70, 90, 0.08);
    }

    .card h2 {
      margin-top: 0;
      font-size: 19px;
    }

    .card p {
      color: #9b7c89;
      line-height: 1.5;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 14px;
      background: #e978a4;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .restore-button {
      background: #f7dce7;
      color: #c65f87;
    }
  </style>
</head>

<body>

  <main class="app">

    <a class="back" href="index.html">
      ← На главную
    </a>

    <h1>Резервная копия 🌸</h1>

    <div class="subtitle">
      Сохрани данные приложения, чтобы не потерять тренировки и статистику.
    </div>

    <section class="card">
      <h2>Сохранить данные</h2>

      <p>
        Создай файл со своей библиотекой тренировок,
        историей и недельными планами.
      </p>

      <button id="create-backup">
        Создать резервную копию
      </button>
    </section>

    <section class="card">
      <h2>Восстановить данные</h2>

      <p>
        Выбери ранее сохранённую резервную копию.
      </p>

      <button class="restore-button" id="restore-backup">
        Восстановить из копии
      </button>
    </section>

  </main>
<script>
  document.getElementById('create-backup')
    .addEventListener('click', function() {

      const backup = {
        version: 1,
        createdAt: new Date().toISOString(),

        myWorkouts:
          JSON.parse(localStorage.getItem('myWorkouts')) || [],

        workoutHistory:
          JSON.parse(localStorage.getItem('workoutHistory')) || [],

        weeklyPlans:
          JSON.parse(localStorage.getItem('weeklyPlans')) || {}
      };

      const backupText =
        JSON.stringify(backup, null, 2);

      const file =
        new Blob(
          [backupText],
          { type: 'application/json' }
        );

      const url =
        URL.createObjectURL(file);

      const link =
        document.createElement('a');

      const now = new Date();

      const year = now.getFullYear();
      const month =
        String(now.getMonth() + 1).padStart(2, '0');
      const day =
        String(now.getDate()).padStart(2, '0');

      link.href = url;

link.download =
  `pink-trainer-backup-${year}-${month}-${day}.json`;

document.body.appendChild(link);

link.click();

document.body.removeChild(link);

setTimeout(function() {
  URL.revokeObjectURL(url);
}, 1000);
    });
</script>
</body>
</html>
